name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: skill-lab lint .
      - run: skill-lab evidence examples/evidence/ai-skills-landscape.json > /tmp/evidence.md
      - run: skill-lab benchmark examples/benchmark/cases.json examples/benchmark/results.json
      - run: python -m unittest discover -s tests -v
